# All images belong to the same release commit. Keep the original release project
# name so its existing gallery-data volume is reused, even in a runner checkout.
name: ${DEPLOY_PROJECT_NAME:-otakuict-data-gallery}
services:
  backend:
    image: ${DOCKERHUB_USERNAME:?Set Docker Hub username}/bias-archive-backend:${IMAGE_TAG:?Set release commit SHA}
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set administrator token}
      DATABASE_PATH: /data/gallery.sqlite
      SEED_DATABASE: /seed/seed.sqlite
    volumes:
      - gallery-data:/data
    restart: unless-stopped
  frontend:
    image: ${DOCKERHUB_USERNAME:?Set Docker Hub username}/bias-archive-frontend:${IMAGE_TAG:?Set release commit SHA}
    ports:
      - "127.0.0.1:${GALLERY_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backoffice:
    image: ${DOCKERHUB_USERNAME:?Set Docker Hub username}/bias-archive-backoffice:${IMAGE_TAG:?Set release commit SHA}
    ports:
      - "127.0.0.1:${BACKOFFICE_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  gallery-data:
