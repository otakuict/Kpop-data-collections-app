name: Frontend — CI and deploy
on:
  pull_request:
    branches: [main]
    paths: ['.nvmrc', 'frontend/**', 'compose.release.yaml', 'scripts/deploy-server.sh', 'scripts/release-workflow.test.mjs', 'scripts/configure-nginx-resolver.sh', 'scripts/nginx-resolver.test.mjs', '.dockerignore', '.github/workflows/frontend.yml', 'package.json', 'package-lock.json', 'frontend/package.json', 'backoffice/package.json', 'scripts/gallery.test.mjs', 'scripts/card-effects.test.mjs', 'scripts/guide-preference.test.mjs', 'scripts/analytics-consent.test.mjs']
  push:
    branches: [main]
    paths: ['.nvmrc', 'frontend/**', 'compose.release.yaml', 'scripts/deploy-server.sh', 'scripts/release-workflow.test.mjs', 'scripts/configure-nginx-resolver.sh', 'scripts/nginx-resolver.test.mjs', '.dockerignore', '.github/workflows/frontend.yml', 'package.json', 'package-lock.json', 'frontend/package.json', 'backoffice/package.json', 'scripts/gallery.test.mjs', 'scripts/card-effects.test.mjs', 'scripts/guide-preference.test.mjs', 'scripts/analytics-consent.test.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'ci-local' }}/bias-archive-frontend
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --workspace frontend --include-workspace-root
      - run: npm run check --workspace frontend
      - run: node --test scripts/release-workflow.test.mjs scripts/nginx-resolver.test.mjs scripts/gallery.test.mjs scripts/card-effects.test.mjs scripts/guide-preference.test.mjs scripts/analytics-consent.test.mjs
      - run: npm run build --workspace frontend
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check publishing configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VITE_BACKOFFICE_URL: ${{ vars.VITE_BACKOFFICE_URL }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$VITE_BACKOFFICE_URL"
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          pull: true
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          build-args: VITE_BACKOFFICE_URL=${{ vars.VITE_BACKOFFICE_URL || 'http://localhost:5174' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_MODE != 'gitops'
    needs: image
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Docker credentials
        run: echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/gallery-docker.XXXXXX")" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull and deploy frontend
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DEPLOY_PROJECT_NAME: ${{ vars.DEPLOY_PROJECT_NAME }}
          GALLERY_PORT: ${{ vars.GALLERY_PORT }}
          BACKOFFICE_PORT: ${{ vars.BACKOFFICE_PORT }}
          SHA: ${{ github.sha }}
        run: bash scripts/deploy-server.sh frontend "$SHA"
  gitops:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_MODE == 'gitops'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a DevOps image update pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GH_TOKEN="$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')"
          export GH_TOKEN
          test -n "$GH_TOKEN"
          jq -n --arg sha "$IMAGE_SHA" \
            '{event_type: "image-published", client_payload: {application: "bias-archive-frontend", sha: $sha}}' \
            | gh api --method POST repos/otakuict/private-server-devops/dispatches --input -
