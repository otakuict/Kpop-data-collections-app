name: Backend — CI and deploy
on:
  pull_request:
    branches: [main]
    paths: ['.nvmrc', 'backend/**', 'compose.release.yaml', 'scripts/deploy-server.sh', 'scripts/release-workflow.test.mjs', '.dockerignore', '.github/workflows/backend.yml', 'data/**', 'scripts/verify-seed.py']
  push:
    branches: [main]
    paths: ['.nvmrc', 'backend/**', 'compose.release.yaml', 'scripts/deploy-server.sh', 'scripts/release-workflow.test.mjs', '.dockerignore', '.github/workflows/backend.yml', 'data/**', 'scripts/verify-seed.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'ci-local' }}/bias-archive-backend
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test scripts/release-workflow.test.mjs
      - run: go test -race ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
      - run: python3 scripts/verify-seed.py
      - run: go build ./cmd/server
        working-directory: backend
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check publishing configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          pull: true
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_MODE != 'gitops'
    needs: image
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Docker credentials
        run: echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/gallery-docker.XXXXXX")" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull and deploy backend
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GANK_FINDER_URL: ${{ vars.GANK_FINDER_URL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL }}
          DEPLOY_PROJECT_NAME: ${{ vars.DEPLOY_PROJECT_NAME }}
          GALLERY_PORT: ${{ vars.GALLERY_PORT }}
          BACKOFFICE_PORT: ${{ vars.BACKOFFICE_PORT }}
          SHA: ${{ github.sha }}
        run: bash scripts/deploy-server.sh backend "$SHA"
  gitops:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_MODE == 'gitops'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a DevOps image update pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GH_TOKEN="$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')"
          export GH_TOKEN
          test -n "$GH_TOKEN"
          jq -n --arg sha "$IMAGE_SHA" \
            '{event_type: "image-published", client_payload: {application: "bias-archive-backend", sha: $sha}}' \
            | gh api --method POST repos/otakuict/private-server-devops/dispatches --input -
