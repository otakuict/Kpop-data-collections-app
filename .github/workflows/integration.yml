name: Browser acceptance — complete stack
on:
  pull_request:
    paths: ['frontend/**', 'backoffice/**', 'backend/**', 'data/**', 'tests/**', 'scripts/**', 'package*.json', 'compose*.yaml', 'playwright.config.js', '.github/workflows/integration.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'backoffice/**', 'backend/**', 'data/**', 'tests/**', 'scripts/**', 'package*.json', 'compose*.yaml', 'playwright.config.js', '.github/workflows/integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: e2e-only-administrator-token-24chars
      GALLERY_PORT: '5183'
      BACKOFFICE_PORT: '5184'
      API_PORT: '8180'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f compose.build.yaml -p bias-archive-test up -d --build --wait
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
      - run: docker compose -f compose.build.yaml -p bias-archive-test logs --no-color
        if: failure()
      - run: docker compose -f compose.build.yaml -p bias-archive-test down -v
        if: always()
