name: Backoffice — CI and deploy
on:
  pull_request:
    branches: [main]
    paths: ['.nvmrc', 'backoffice/**', 'compose.release.yaml', 'scripts/deploy-server.sh', 'scripts/release-workflow.test.mjs', 'scripts/configure-nginx-resolver.sh', 'scripts/nginx-resolver.test.mjs', '.dockerignore', '.github/workflows/backoffice.yml', 'package.json', 'package-lock.json', 'frontend/package.json', 'backoffice/package.json', 'scripts/sheet-scan.test.mjs', 'tests/backoffice-finder.spec.js', 'playwright.config.js']
  push:
    branches: [main]
    paths: ['.nvmrc', 'backoffice/**', 'compose.release.yaml', 'scripts/deploy-server.sh', 'scripts/release-workflow.test.mjs', 'scripts/configure-nginx-resolver.sh', 'scripts/nginx-resolver.test.mjs', '.dockerignore', '.github/workflows/backoffice.yml', 'package.json', 'package-lock.json', 'frontend/package.json', 'backoffice/package.json', 'scripts/sheet-scan.test.mjs', 'tests/backoffice-finder.spec.js', 'playwright.config.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backoffice-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'ci-local' }}/bias-archive-backoffice
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --workspace backoffice --include-workspace-root
      - run: npm run check --workspace backoffice
      - run: node --test scripts/release-workflow.test.mjs scripts/nginx-resolver.test.mjs scripts/sheet-scan.test.mjs
      - name: Install Edge for finder form checks
        run: npx playwright install --with-deps msedge
      - name: Verify finder selection on desktop and mobile
        env:
          PLAYWRIGHT_CHROME_PATH: /opt/microsoft/msedge/msedge
        run: |
          set -euo pipefail
          npm run dev --workspace backoffice -- --host 127.0.0.1 --port 5184 --strictPort > "$RUNNER_TEMP/backoffice-finder.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5184/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/backoffice-finder.log"
            exit 1
          fi
          npx playwright test tests/backoffice-finder.spec.js
      - run: npm run build --workspace backoffice
        env:
          VITE_BASE_PATH: /backoffice/
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check publishing configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VITE_GALLERY_URL: ${{ vars.VITE_GALLERY_URL }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$VITE_GALLERY_URL"
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backoffice/Dockerfile
          pull: true
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          build-args: |
            VITE_GALLERY_URL=${{ vars.VITE_GALLERY_URL || 'http://localhost:5173' }}
            VITE_BASE_PATH=${{ vars.DEPLOYMENT_MODE == 'gitops' && '/backoffice/' || '/' }}
          cache-from: type=gha,scope=backoffice
          cache-to: type=gha,mode=max,scope=backoffice
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_MODE != 'gitops'
    needs: image
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Docker credentials
        run: echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/gallery-docker.XXXXXX")" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull and deploy backoffice
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DEPLOY_PROJECT_NAME: ${{ vars.DEPLOY_PROJECT_NAME }}
          GALLERY_PORT: ${{ vars.GALLERY_PORT }}
          BACKOFFICE_PORT: ${{ vars.BACKOFFICE_PORT }}
          SHA: ${{ github.sha }}
        run: bash scripts/deploy-server.sh backoffice "$SHA"
  gitops:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_MODE == 'gitops'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a DevOps image update pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GH_TOKEN="$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')"
          export GH_TOKEN
          test -n "$GH_TOKEN"
          jq -n --arg sha "$IMAGE_SHA" \
            '{event_type: "image-published", client_payload: {application: "bias-archive-backoffice", sha: $sha}}' \
            | gh api --method POST repos/otakuict/private-server-devops/dispatches --input -
